openapi: 3.0.3
info:
  title: Microverse API
  version: 1.0.0
  description: |
    Microverse — a cross-platform micro-application deployment platform.
    Deploy and manage static sites (http-server, nginx) and Node.js (npm) apps via PM2.

    All responses use the envelope:
    `{ success: boolean, data?: <T>, error?: { message: string } }`.

    All `/apps` endpoints require an authenticated admin session (`POST /api/auth/login`); missing/invalid session → HTTP 401.

    Platform self-update operations under `/system` (`/system/version`, `/system/update`, `/system/update/status`) are also authenticated admin-only endpoints.

    **Async deploy jobs**: `POST /apps/{id}/start` and `POST /apps/{id}/git/pull` answer `202` as soon as the request can decide WITHOUT doing the work, then run detached as deploy jobs (`DeployRunner` → `DeployManager.deployApp` / `GitLifecycle.pull`). Progress and outcome are read from the `deploy` summary on app objects or from `GET /apps/{id}/deploy`. While an app's job is live, every mutating request to that app answers `409` (message `部署进行中（<kind> · <step>），请等待完成后再<action>`) — reads stay allowed. Job state lives in the shared SQLite `app_deploy_job` table (one row per app), so claims, steps, and the boot-time interruption sweep work across cluster workers.
  license:
    name: MIT
servers:
  - url: /api
    description: API root (relative — works in dev and prod)
tags:
  - name: System
    description: Health, public configuration, and authenticated platform self-update operations
  - name: Auth
    description: Admin login / logout / session
  - name: Applications
    description: Application CRUD
  - name: Lifecycle
    description: Start / stop / restart / sync / deploy-job status
  - name: Files & Env
    description: File listing, upload, and environment variables
  - name: Logs
    description: Log streaming
  - name: Git
    description: Git-source binding, update checks, and pulls (admin-only)
  - name: Webhooks
    description: Public GitHub push receiver (per-app HMAC, no session)
paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/HealthData' }
  /config:
    get:
      tags: [System]
      summary: Public client configuration (upload limits)
      operationId: getConfig
      responses:
        '200':
          description: Public config
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ConfigData' }
  /system/version:
    get:
      tags: [System]
      summary: Platform version and update availability
      operationId: getSystemVersion
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: Version info, content: { application/json: { schema: { type: object } } } }
        '401': { description: Not authenticated }
  /system/update:
    post:
      tags: [System]
      summary: Start a platform self-update
      operationId: startSystemUpdate
      security: [{ sessionAuth: [] }]
      responses:
        '202': { description: Update started }
        '400': { description: Update unavailable or preflight failed }
        '401': { description: Not authenticated }
        '409':
          description: |
            Refused (two distinct causes share this code):
            * an update is already running — `已有更新正在进行`;
            * an app deploy job is live on ANY app — a self-update ends in `pm2 reload`,
              which would kill it. Checked in preflight and re-checked after the update-lock
              claim (race-free). Message names the blocker: `有应用正在部署（<app> · <step>），请等待完成`.
        '500': { description: Failed to spawn the detached update helper }
  /system/update/status:
    get:
      tags: [System]
      summary: Update progress and log tail
      operationId: getSystemUpdateStatus
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: Update state }
        '401': { description: Not authenticated }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: integer }
                          username: { type: string }
        '400':
          description: Missing username/password
        '401':
          description: Invalid credentials
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current session user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: integer }
                          username: { type: string }
        '401':
          description: Not authenticated
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Destroy the admin session
      responses:
        '200':
          description: Logged out
  /apps:
    get:
      tags: [Applications]
      summary: List all applications
      operationId: listApps
      responses:
        '200':
          description: App list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/App' }
    post:
      tags: [Applications]
      summary: Create a new application
      operationId: createApp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppCreateInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/App' }
        '400':
          description: Missing fields / invalid deploy_type / name already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}:
    get:
      tags: [Applications]
      summary: Get an application by ID
      operationId: getApp
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: The application
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/App' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Applications]
      summary: Delete an application (running-check reconciled against PM2; a dead-but-"running" app is cleaned up)
      operationId: deleteApp
      parameters:
        - { $ref: '#/components/parameters/AppId' }
        - name: deleteFiles
          in: query
          required: false
          description: Also remove the app's deploy directory (including any Git checkout). Default false keeps the files on disk.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      message: { type: string, example: "App deleted successfully" }
                      filesDeleted: { type: boolean, example: false }
        '400':
          description: Cannot delete a running app
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            A deploy job is live for this app (`...请等待完成后再删除` — the row cascades with
            the app, so refusing before the delete is what keeps the running job's `pm2 start`
            from resurrecting an untracked process), or a git sync holds the working-tree claim
            (`Update in progress`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/start:
    post:
      tags: [Lifecycle]
      summary: Start an application — 202 accepted, runs as an async deploy job
      description: |
        Returns `202` once the deploy job is atomically claimed (`DeployJobs.claim`), NOT once the
        app is up. The request answers synchronously only what it can decide WITHOUT doing the work:
        app lookup, live-job gate, PM2 reconcile (already-running check), on-disk validation for
        NON-git apps (a git-bound app's directory is legitimately empty until the clone runs — its
        validation moves into the job), and the git-claim / self-update-lock checks. Everything else
        — git clone/fetch, `npm install`/`npm run build` (fingerprint-gated), nginx preflight,
        `pm2 start`, proxy regenerate — runs detached and is reported through the job row: watch
        `GET /apps/{id}/deploy` or the `deploy` summary on app objects. Install/build failures,
        clone failures and timeouts are therefore NO LONGER responses of this endpoint; they land
        as the job's terminal `failed` status with the message in `deploy.message`.
      operationId: startApp
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '202':
          description: Accepted — job claimed and running detached (outcome via the job row)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/DeployAccepted' }
        '400':
          description: App is already running (synchronous PM2 reconcile), or a non-git app fails on-disk validation (empty/missing directory, missing `index.html`, missing start script, invalid package.json)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: App not found (also covers the app vanishing between lookup and claim — explicitly NOT a 202 then)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            Refused (three distinct causes): a deploy job is already live for this app
            (`部署进行中（<kind> · <step>），请等待完成后再启动`); a webhook sync owns the
            working-tree claim (`Update in progress`); the platform self-update lock is held
            (`平台正在自更新，请稍后再试`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/deploy:
    get:
      tags: [Lifecycle]
      summary: Current deploy-job state plus a bounded tail of the job log
      description: |
        The endpoint that turns a 202 into visible progress (the dashboard's silent refresh and the
        log drawer poll it; there is deliberately no SSE for job logs). `job` is EXACTLY the `deploy`
        summary attached to app objects (one producer, AppManager's `toDeploySummary`; null when the
        app has never deployed). `logTail` is server-side bounded — newest 200 non-empty lines within
        the last 64KB, ANSI-stripped — and takes NO client parameter to enlarge it; it is `[]` when
        the job row, its `log_path`, or the file is missing (reading a log must never fail the request).
      operationId: getAppDeploy
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Job summary + bounded log tail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/DeployStatusData' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/stop:
    post:
      tags: [Lifecycle]
      summary: Stop an application (idempotent — already stopped or process gone is a no-op success)
      operationId: stopApp
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/App' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: A deploy job is live for this app (`...请等待完成后再停止`) — the app is not running yet, so a no-op stop followed by the job's own launch would mean the operator's button did the opposite of what was pressed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/restart:
    post:
      tags: [Lifecycle]
      summary: Restart a running application
      operationId: restartApp
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Restarted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/App' }
        '400':
          description: App is not running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: A deploy job is live for this app (`...请等待完成后再重启`), or a git sync owns the working tree (`Update in progress`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/sync:
    post:
      tags: [Lifecycle]
      summary: Sync app status with the actual PM2 process state
      operationId: syncApp
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/App' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/files:
    get:
      tags: [Files & Env]
      summary: List files in an application's deploy directory (`.git` is hidden)
      operationId: listFiles
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: File list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FileEntry' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/metrics:
    get:
      tags: [Applications]
      summary: Get an app's resource-metrics history
      description: Returns recent CPU/memory samples (default newest 180 per app, 10s interval) from the shared SQLite metrics store — identical from every cluster worker and preserved across restarts.
      operationId: getAppMetrics
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Sample array (newest last)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        ts: { type: integer }
                        cpu: { type: number }
                        memory: { type: integer }
                        uptimeMs: { type: integer }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/default:
    put:
      tags: [Applications]
      operationId: setDefaultApp
      summary: Mark this app as the root-domain default (single-default; regenerates the edge proxy)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The updated raw `apps` row — deliberately NOT the enriched App shape (no `git`, `deploy` or `metrics` keys in this response)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AppRawRow' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: A deploy job is live for this app (`...请等待完成后再设为默认`) — the job's proxy step would regenerate the edge from a routing table that no longer matches the operator's newest choice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Applications]
      operationId: clearDefaultApp
      summary: Clear the root-domain default flag, then regenerate the edge proxy
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Default cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      message: { type: string, example: "Default cleared" }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: A deploy job is live for this app (`...请等待完成后再取消默认`) — the job's proxy step could re-add the root route this call is removing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/git:
    get:
      tags: [Git]
      summary: Get the app's Git source binding (includes webhook URL and secret)
      description: Admin-only. Unlike the secret-free `git` summary on app responses, this shape exposes the per-app webhook secret.
      operationId: getAppGitSource
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Git source binding
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AppGitSource' }
        '404':
          description: App not found or no Git source bound
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      tags: [Git]
      summary: Bind or re-bind the app's Git source
      description: A first bind generates the webhook secret; a re-bind preserves it. Changing the URL or branch resets deployment progress.
      operationId: putAppGitSource
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitBindInput' }
      responses:
        '200':
          description: Saved binding
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AppGitSource' }
        '400':
          description: Missing/invalid Git URL or branch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: A git sync owns the working tree (`Update in progress`), or a deploy job is live for this app (`...请等待完成后再修改 Git 源`) — rebinding mid-job would make the running job deploy a source the operator has already replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Git]
      summary: Unbind the Git source (app row, directory, and files are kept)
      operationId: deleteAppGitSource
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Unbound
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: A git sync owns the working tree (`Update in progress`), or a deploy job is live for this app (`...请等待完成后再解绑 Git 源`) — the running job still reads this binding (clone/build)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/git/secret:
    post:
      tags: [Git]
      summary: Rotate the per-app webhook secret
      description: The binding, deployed commit, and deployment progress are preserved. The previous secret stops working immediately.
      operationId: rotateAppGitSecret
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Updated binding with the new secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AppGitSource' }
        '404':
          description: App not found or no Git source bound
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: A deploy job is live for this app (`...请等待完成后再轮换密钥`) — a webhook delivery racing the job could authenticate against a secret mid-rotation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/git/check:
    post:
      tags: [Git]
      summary: Compare the deployed commit with the remote branch head
      description: Uses `git ls-remote` only — no worktree changes. A client-side git failure (bad URL/branch/credentials) is a 400.
      operationId: checkAppGitSource
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Comparison result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/GitCheckResult' }
        '400':
          description: Cannot reach the remote (git error)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: App not found or no Git source bound
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/git/pull:
    post:
      tags: [Git]
      summary: Pull the branch, rebuild npm apps, and restart a running app — 202 accepted, runs as an async deploy job (kind `pull`)
      description: |
        Same async contract as `POST /apps/{id}/start` (spec decision 7): the minutes-long
        fetch / reset / npm install / npm run build / restart chain runs detached; the 202 only
        says the deploy job was claimed. The outcome is read afterwards from the app object's
        `git` summary (`last_status` `updating` → `success`/`failed`, `deployed_commit`) and the
        `deploy` job summary — NOT from this response. Rollback semantics are unchanged and live
        inside the job: a fetch or build failure rolls the worktree back to the previous HEAD (a
        restart-only failure keeps the new commit); if a webhook sync won the working-tree claim
        after this job claimed its own, the job converges to `failed` — the 202 cannot be revoked.
        The old synchronous `200 + {deployedCommit,status}` and the pull-failure `400` are gone:
        `git.js` still maps client git errors to 400 defensively, but every failure of the pull
        itself now surfaces through the job row.
      operationId: pullAppGitSource
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '202':
          description: Accepted — pull job claimed and running detached
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/DeployAccepted' }
        '404':
          description: App not found or no Git source bound (also the app vanishing mid-claim)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            Refused (three distinct causes): a deploy job is already live for this app
            (`部署进行中（<kind> · <step>），请等待完成后再拉取更新`); a webhook sync owns the
            working-tree claim (`Update in progress`); the platform self-update lock is held
            (`平台正在自更新，请稍后再试`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/backup:
    get:
      tags: [Applications]
      operationId: backupApp
      summary: Download a backup zip of an app (files + manifest; `.git` excluded)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Backup zip (files + microverse-manifest.json)
          content:
            application/zip:
              schema: { type: string, format: binary }
        '404':
          description: App not found
  /apps/restore:
    post:
      tags: [Applications]
      operationId: restoreApp
      summary: Restore an app from a backup zip
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: App restored (status stopped) — returns the raw `apps` row, NOT the enriched App shape (no `git`/`deploy`/`metrics` keys; a restored app is unbound anyway)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AppRawRow' }
        '400':
          description: Invalid backup / name conflict / missing file
  /apps/{id}/upload:
    post:
      tags: [Files & Env]
      summary: Upload files (multipart). ZIPs auto-extract with zip-slip guard.
      description: Git-source apps reject uploads (400) — the repository owns the app directory.
      operationId: uploadFiles
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '200':
          description: Files uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/UploadResponse' }
        '400':
          description: No files / file too large / ZIP extraction failed / Git-source app (repo content owns the directory)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: A deploy job is live for this app (`...请等待完成后再上传文件`) — install/build are reading exactly this directory. Accepted v1 residual — the request body is already streaming when the 409 is answered, so browsers surface it as an upload failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/env:
    get:
      tags: [Files & Env]
      summary: List an application's environment variables
      operationId: getAppEnv
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Env entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EnvEntry' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      tags: [Files & Env]
      summary: Replace an application's environment variables (applies on next start)
      operationId: setAppEnv
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvPutInput' }
      responses:
        '200':
          description: Saved env entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EnvEntry' }
        '400':
          description: Invalid key / duplicate key / env not an array
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: A deploy job is live for this app (`...请等待完成后再修改环境变量`) — env is baked at launch, so mid-job writes could ship a half-new set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/logs/stream:
    get:
      tags: [Logs]
      summary: Stream an app's PM2 logs as SSE (recent history, then live)
      operationId: streamLogs
      parameters:
        - { $ref: '#/components/parameters/AppId' }
        - name: lines
          in: query
          required: false
          schema: { type: integer, default: 100, maximum: 1000, minimum: 1 }
          description: Number of history lines per stream
      responses:
        '200':
          description: |
            Server-Sent Events stream (`text/event-stream`). Events:
            `history` — `{ lines: [{level, msg}] }` (out then err);
            `line` — `{ level: "out"|"err", msg, ts }` (live);
            `error` — `{ message }`.
            A `: ping` comment is sent every 15s as keep-alive.
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /webhooks/github/{appId}:
    post:
      tags: [Webhooks]
      summary: Public GitHub push webhook (HMAC-SHA256 authenticated per app)
      description: |
        Mounted before `express.json()` and reads the raw body (`application/json`, max 2MB).
        Authenticated only by `X-Hub-Signature-256` over the exact bytes using the app's
        webhook secret (no session). Only `push` events to the bound branch of the bound
        repository trigger a sync; with `auto_update` off, the remote commit is recorded and
        `last_status` becomes `update_available`. Rate-limited to 120 requests/min/IP.
      operationId: githubWebhook
      parameters:
        - name: appId
          in: path
          required: true
          schema: { type: integer }
          description: Application ID encoded in the payload URL
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Raw GitHub push payload (or ping payload).
      responses:
        '200':
          description: Ping acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        '202':
          description: Accepted — sync queued, update recorded, or event ignored (non-matching branch/repository)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  message: { type: string, example: "update queued" }
                  ignored: { type: boolean, example: true }
        '204':
          description: Non-push event acknowledged and dropped
        '400':
          description: Malformed JSON payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Missing/invalid X-Hub-Signature-256
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Unknown app or no Git source bound
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Rate limited (120/min/IP)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Admin session cookie set by `POST /api/auth/login`.
  parameters:
    AppId:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: Application ID
  schemas:
    App:
      type: object
      properties:
        id: { type: integer, example: 7 }
        name: { type: string, example: "my-app" }
        path: { type: string, example: "/data/microverse/apps/my-app" }
        deploy_type:
          type: string
          enum: [npm, http-server, nginx]
          example: "npm"
        port: { type: integer, nullable: true, example: 3000 }
        status:
          type: string
          enum: [running, stopped]
          example: "running"
        metrics:
          type: object
          nullable: true
          description: Latest resource sample (null if the app has never run / sampler has no data).
          properties:
            ts: { type: integer, description: "epoch ms" }
            cpu: { type: number, description: "CPU %" }
            memory: { type: integer, description: "bytes" }
            uptimeMs: { type: integer, description: "uptime in ms" }
        git:
          $ref: '#/components/schemas/GitSummary'
        deploy:
          $ref: '#/components/schemas/DeploySummary'
        created_at: { type: string, example: "2026-07-12 03:25:59" }
        updated_at: { type: string, example: "2026-07-12 03:26:23" }
      description: |
        Enriched app shape. Both summary objects (`git`, `deploy`) are attached by
        AppManager.getAllApps/getAppById — present in `GET /apps`, `GET /apps/{id}`,
        `POST /apps` (create returns the enriched row too: `deploy: null` before the first
        deploy), and the stop/restart/sync responses. Raw-row responses have NEITHER key:
        `PUT /apps/{id}/default` and `POST /apps/restore` return `AppRawRow` instead.
    AppRawRow:
      type: object
      properties:
        id: { type: integer, example: 7 }
        name: { type: string, example: "my-app" }
        path: { type: string, example: "/data/microverse/apps/my-app" }
        deploy_type:
          type: string
          enum: [npm, http-server, nginx]
          example: "npm"
        port: { type: integer, nullable: true, example: 3000 }
        status:
          type: string
          enum: [running, stopped]
          example: "running"
        is_default: { type: integer, enum: [0, 1], example: 0 }
        created_at: { type: string, example: "2026-07-12 03:25:59" }
        updated_at: { type: string, example: "2026-07-12 03:26:23" }
      description: |
        Bare `apps` table row (`SELECT * FROM apps` — `queries.setDefaultApp` and
        the restore path's `queries.getAppById`) — the actual shape behind
        `PUT /apps/{id}/default` and `POST /apps/restore`. Unlike the enriched
        `App` it carries no `git`/`deploy`/`metrics` keys, and it DOES carry
        `is_default` — a column the `App` schema does not list.
    AppCreateInput:
      type: object
      required: [name, deploy_type]
      properties:
        name: { type: string, example: "my-app" }
        deploy_type:
          type: string
          enum: [npm, http-server, nginx]
          example: "npm"
        git_url:
          type: string
          description: Optional Git repository URL; when present the source is bound in the same call.
          example: "https://github.com/owner/repo"
        git_branch:
          type: string
          default: main
          description: Branch to deploy (only meaningful with git_url).
        git_auto_update:
          type: boolean
          default: true
          description: Pull on start and on webhook pushes (only meaningful with git_url).
    GitSummary:
      type: object
      nullable: true
      description: Secret-free Git binding attached to enriched app responses (null when the app is not Git-sourced); same attach scope as `DeploySummary`.
      properties:
        url: { type: string, example: "https://github.com/owner/repo" }
        branch: { type: string, example: "main" }
        auto_update: { type: integer, enum: [0, 1], example: 1 }
        deployed_commit: { type: string, nullable: true, example: "3f2a9c1..." }
        remote_commit: { type: string, nullable: true, example: "9b1e0d4..." }
        synced_at: { type: string, nullable: true, example: "2026-07-12 03:26:23" }
        last_status:
          type: string
          enum: [idle, updating, success, failed, update_available]
          example: "success"
        last_error: { type: string, nullable: true }
    AppGitSource:
      type: object
      description: Admin-facing Git binding. Unlike `GitSummary`, includes the webhook URL and secret.
      properties:
        url: { type: string, example: "https://github.com/owner/repo" }
        branch: { type: string, example: "main" }
        autoUpdate: { type: boolean, example: true }
        webhookUrl: { type: string, example: "https://apps.example.com/api/webhooks/github/7" }
        webhookSecret: { type: string, example: "0123456789abcdef..." }
        deployedCommit: { type: string, nullable: true }
        remoteCommit: { type: string, nullable: true }
        syncedAt: { type: string, nullable: true }
        lastStatus:
          type: string
          enum: [idle, updating, success, failed, update_available]
          example: "success"
        lastError: { type: string, nullable: true }
    GitBindInput:
      type: object
      required: [url]
      properties:
        url: { type: string, example: "https://github.com/owner/repo" }
        branch: { type: string, example: "main", description: Defaults to main on first bind; omitted keeps the current branch." }
        autoUpdate: { type: boolean, description: "Omitted keeps the current value; defaults to true on first bind." }
    GitCheckResult:
      type: object
      properties:
        remoteCommit: { type: string, nullable: true, description: null when the branch does not exist on the remote }
        deployedCommit: { type: string, nullable: true }
        upToDate: { type: boolean, example: false }
    DeployAccepted:
      type: object
      description: The only body a 202 deploy acceptance returns — an acknowledgement, never app state.
      properties:
        app_id: { type: integer, example: 7 }
        kind:
          type: string
          enum: [start, pull]
          example: "start"
        status:
          type: string
          enum: [running]
          description: Row status right after the claim — there is NO 'queued' status (queue-wait is expressed by step='queued')
          example: "running"
    DeploySummary:
      type: object
      nullable: true
      description: |
        Current-or-most-recent deploy job for the app (null when the app has never deployed).
        camelCase by contract — no snake_case column and no pid/log_path leaks to the client
        (AppManager's `toDeploySummary` is the single producer). `live` is DeployJobs.isLive's
        verdict (non-terminal status + owner pid alive + started_at within DEPLOY_JOB_STALE_MS),
        never a bare status check — a dead-owner row must not hold the UI in a fake deploying state.
        An interrupted job (platform restart / killed worker) converges at boot to
        status='failed' with message='部署被中断（平台重启）' and keeps the step it died on.
      properties:
        kind:
          type: string
          enum: [start, pull]
          example: "start"
        status:
          type: string
          enum: [running, succeeded, failed]
          example: "running"
        step:
          type: string
          nullable: true
          enum: [queued, git, validate, install, build, nginx, launch, proxy, done]
          description: Progress ladder (utils/deploy-steps.js) — array order IS execution order; gated steps (git/install/build/nginx/proxy) are reported only when that work actually runs.
          example: "install"
        message:
          type: string
          nullable: true
          description: Failure summary for inline UI display at terminal status (null on success)
        startedAt: { type: string, nullable: true, example: "2026-11-18 03:25:59" }
        finishedAt: { type: string, nullable: true, example: "2026-11-18 03:26:23" }
        live: { type: boolean, example: true }
    DeployStatusData:
      type: object
      description: GET /apps/{id}/deploy payload — the job summary plus a server-bounded tail of the job log.
      properties:
        job: { $ref: '#/components/schemas/DeploySummary' }
        logTail:
          type: array
          items: { type: string }
          description: Newest ≤200 non-empty lines from within the last 64KB of the job's log file (data/deploy-logs/<app>-<epoch>.log), ANSI-stripped; [] when the row, path or file is missing. No client parameter enlarges this.
    EnvEntry:
      type: object
      required: [key]
      properties:
        key: { type: string, example: "API_KEY" }
        value: { type: string, nullable: true, example: "secret123" }
    EnvPutInput:
      type: object
      required: [env]
      properties:
        env:
          type: array
          items: { $ref: '#/components/schemas/EnvEntry' }
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          required: [message]
          properties:
            message: { type: string, example: "App not found" }
    UploadResponse:
      type: object
      properties:
        filesUploaded: { type: integer, example: 2 }
        files:
          type: array
          items: { type: string }
          example: ["index.html", "server.js"]
    FileEntry:
      type: object
      properties:
        name: { type: string, example: "index.html" }
        type:
          type: string
          enum: [file, directory]
          example: "file"
        path: { type: string, example: "index.html", description: "Relative to the app root (absolute server paths are never exposed)" }
    HealthData:
      type: object
      properties:
        status: { type: string, example: "ok" }
        timestamp: { type: string, format: date-time }
        uptime: { type: number, example: 21.302 }
    ConfigData:
      type: object
      properties:
        upload:
          type: object
          properties:
            maxFileSize: { type: integer, example: 104857600 }
            maxFiles: { type: integer, example: 100 }
