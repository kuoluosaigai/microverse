openapi: 3.0.3
info:
  title: Microverse API
  version: 1.0.0
  description: |
    Microverse — a cross-platform micro-application deployment platform.
    Deploy and manage static sites (http-server, nginx) and Node.js (npm) apps via PM2.

    All responses use the envelope:
    `{ success: boolean, data?: <T>, error?: { message: string } }`.

    All `/apps` endpoints require an authenticated admin session (`POST /api/auth/login`); missing/invalid session → HTTP 401.

    Platform self-update operations under `/system` (`/system/version`, `/system/update`, `/system/update/status`) are also authenticated admin-only endpoints.
  license:
    name: MIT
servers:
  - url: /api
    description: API root (relative — works in dev and prod)
tags:
  - name: System
    description: Health, public configuration, and authenticated platform self-update operations
  - name: Auth
    description: Admin login / logout / session
  - name: Applications
    description: Application CRUD
  - name: Lifecycle
    description: Start / stop / restart / sync
  - name: Files & Env
    description: File listing, upload, and environment variables
  - name: Logs
    description: Log streaming
  - name: Git
    description: Git-source binding, update checks, and pulls (admin-only)
  - name: Webhooks
    description: Public GitHub push receiver (per-app HMAC, no session)
paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/HealthData' }
  /config:
    get:
      tags: [System]
      summary: Public client configuration (upload limits)
      operationId: getConfig
      responses:
        '200':
          description: Public config
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ConfigData' }
  /system/version:
    get:
      tags: [System]
      summary: Platform version and update availability
      operationId: getSystemVersion
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: Version info, content: { application/json: { schema: { type: object } } } }
        '401': { description: Not authenticated }
  /system/update:
    post:
      tags: [System]
      summary: Start a platform self-update
      operationId: startSystemUpdate
      security: [{ sessionAuth: [] }]
      responses:
        '202': { description: Update started }
        '400': { description: Update unavailable or preflight failed }
        '401': { description: Not authenticated }
        '409': { description: Update already running }
        '500': { description: Failed to spawn the detached update helper }
  /system/update/status:
    get:
      tags: [System]
      summary: Update progress and log tail
      operationId: getSystemUpdateStatus
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: Update state }
        '401': { description: Not authenticated }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: integer }
                          username: { type: string }
        '400':
          description: Missing username/password
        '401':
          description: Invalid credentials
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current session user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: integer }
                          username: { type: string }
        '401':
          description: Not authenticated
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Destroy the admin session
      responses:
        '200':
          description: Logged out
  /apps:
    get:
      tags: [Applications]
      summary: List all applications
      operationId: listApps
      responses:
        '200':
          description: App list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/App' }
    post:
      tags: [Applications]
      summary: Create a new application
      operationId: createApp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppCreateInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/App' }
        '400':
          description: Missing fields / invalid deploy_type / name already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}:
    get:
      tags: [Applications]
      summary: Get an application by ID
      operationId: getApp
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: The application
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/App' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Applications]
      summary: Delete an application (running-check reconciled against PM2; a dead-but-"running" app is cleaned up)
      operationId: deleteApp
      parameters:
        - { $ref: '#/components/parameters/AppId' }
        - name: deleteFiles
          in: query
          required: false
          description: Also remove the app's deploy directory (including any Git checkout). Default false keeps the files on disk.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      message: { type: string, example: "App deleted successfully" }
                      filesDeleted: { type: boolean, example: false }
        '400':
          description: Cannot delete a running app
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/start:
    post:
      tags: [Lifecycle]
      summary: Start an application (npm apps install/build only when package.json/lockfile or the app tree changed)
      operationId: startApp
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Started (running)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/App' }
        '400':
          description: Already running, missing start script, npm install/build failure/timeout, invalid package.json
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/stop:
    post:
      tags: [Lifecycle]
      summary: Stop an application (idempotent — already stopped or process gone is a no-op success)
      operationId: stopApp
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/App' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/restart:
    post:
      tags: [Lifecycle]
      summary: Restart a running application
      operationId: restartApp
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Restarted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/App' }
        '400':
          description: App is not running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/sync:
    post:
      tags: [Lifecycle]
      summary: Sync app status with the actual PM2 process state
      operationId: syncApp
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/App' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/files:
    get:
      tags: [Files & Env]
      summary: List files in an application's deploy directory (`.git` is hidden)
      operationId: listFiles
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: File list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FileEntry' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/metrics:
    get:
      tags: [Applications]
      summary: Get an app's resource-metrics history
      description: Returns recent CPU/memory samples (default newest 180 per app, 10s interval) from the shared SQLite metrics store — identical from every cluster worker and preserved across restarts.
      operationId: getAppMetrics
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Sample array (newest last)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        ts: { type: integer }
                        cpu: { type: number }
                        memory: { type: integer }
                        uptimeMs: { type: integer }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/default:
    put:
      tags: [Applications]
      operationId: setDefaultApp
      summary: Mark this app as the root-domain default (single-default; regenerates the edge proxy)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Updated app
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/App' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Applications]
      operationId: clearDefaultApp
      summary: Clear the root-domain default flag, then regenerate the edge proxy
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Default cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      message: { type: string, example: "Default cleared" }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/git:
    get:
      tags: [Git]
      summary: Get the app's Git source binding (includes webhook URL and secret)
      description: Admin-only. Unlike the secret-free `git` summary on app responses, this shape exposes the per-app webhook secret.
      operationId: getAppGitSource
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Git source binding
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AppGitSource' }
        '404':
          description: App not found or no Git source bound
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      tags: [Git]
      summary: Bind or re-bind the app's Git source
      description: A first bind generates the webhook secret; a re-bind preserves it. Changing the URL or branch resets deployment progress.
      operationId: putAppGitSource
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitBindInput' }
      responses:
        '200':
          description: Saved binding
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AppGitSource' }
        '400':
          description: Missing/invalid Git URL or branch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Update in progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Git]
      summary: Unbind the Git source (app row, directory, and files are kept)
      operationId: deleteAppGitSource
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Unbound
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Update in progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/git/secret:
    post:
      tags: [Git]
      summary: Rotate the per-app webhook secret
      description: The binding, deployed commit, and deployment progress are preserved. The previous secret stops working immediately.
      operationId: rotateAppGitSecret
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Updated binding with the new secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AppGitSource' }
        '404':
          description: App not found or no Git source bound
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/git/check:
    post:
      tags: [Git]
      summary: Compare the deployed commit with the remote branch head
      description: Uses `git ls-remote` only — no worktree changes. A client-side git failure (bad URL/branch/credentials) is a 400.
      operationId: checkAppGitSource
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Comparison result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/GitCheckResult' }
        '400':
          description: Cannot reach the remote (git error)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: App not found or no Git source bound
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/git/pull:
    post:
      tags: [Git]
      summary: Pull the branch, rebuild npm apps, and restart a running app
      description: Synchronous — the DB claim is the single-flight guard, so a concurrent pull returns 409 rather than racing the working tree. A fetch/build/restart failure returns 400 with the worktree rolled back to the previous commit (a restart-only failure keeps the new commit).
      operationId: pullAppGitSource
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Pull completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/GitPullResult' }
        '400':
          description: Pull failed (fetch/build/restart); see error.message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: App not found or no Git source bound
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Update already in progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/backup:
    get:
      tags: [Applications]
      operationId: backupApp
      summary: Download a backup zip of an app (files + manifest; `.git` excluded)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Backup zip (files + microverse-manifest.json)
          content:
            application/zip:
              schema: { type: string, format: binary }
        '404':
          description: App not found
  /apps/restore:
    post:
      tags: [Applications]
      operationId: restoreApp
      summary: Restore an app from a backup zip
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: App restored (status stopped)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/App' }
        '400':
          description: Invalid backup / name conflict / missing file
  /apps/{id}/upload:
    post:
      tags: [Files & Env]
      summary: Upload files (multipart). ZIPs auto-extract with zip-slip guard.
      description: Git-source apps reject uploads (400) — the repository owns the app directory.
      operationId: uploadFiles
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '200':
          description: Files uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/UploadResponse' }
        '400':
          description: No files / file too large / ZIP extraction failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/env:
    get:
      tags: [Files & Env]
      summary: List an application's environment variables
      operationId: getAppEnv
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      responses:
        '200':
          description: Env entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EnvEntry' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      tags: [Files & Env]
      summary: Replace an application's environment variables (applies on next start)
      operationId: setAppEnv
      parameters: [{ $ref: '#/components/parameters/AppId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvPutInput' }
      responses:
        '200':
          description: Saved env entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EnvEntry' }
        '400':
          description: Invalid key / duplicate key / env not an array
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /apps/{id}/logs/stream:
    get:
      tags: [Logs]
      summary: Stream an app's PM2 logs as SSE (recent history, then live)
      operationId: streamLogs
      parameters:
        - { $ref: '#/components/parameters/AppId' }
        - name: lines
          in: query
          required: false
          schema: { type: integer, default: 100, maximum: 1000, minimum: 1 }
          description: Number of history lines per stream
      responses:
        '200':
          description: |
            Server-Sent Events stream (`text/event-stream`). Events:
            `history` — `{ lines: [{level, msg}] }` (out then err);
            `line` — `{ level: "out"|"err", msg, ts }` (live);
            `error` — `{ message }`.
            A `: ping` comment is sent every 15s as keep-alive.
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          description: App not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /webhooks/github/{appId}:
    post:
      tags: [Webhooks]
      summary: Public GitHub push webhook (HMAC-SHA256 authenticated per app)
      description: |
        Mounted before `express.json()` and reads the raw body (`application/json`, max 2MB).
        Authenticated only by `X-Hub-Signature-256` over the exact bytes using the app's
        webhook secret (no session). Only `push` events to the bound branch of the bound
        repository trigger a sync; with `auto_update` off, the remote commit is recorded and
        `last_status` becomes `update_available`. Rate-limited to 120 requests/min/IP.
      operationId: githubWebhook
      parameters:
        - name: appId
          in: path
          required: true
          schema: { type: integer }
          description: Application ID encoded in the payload URL
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Raw GitHub push payload (or ping payload).
      responses:
        '200':
          description: Ping acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        '202':
          description: Accepted — sync queued, update recorded, or event ignored (non-matching branch/repository)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  message: { type: string, example: "update queued" }
                  ignored: { type: boolean, example: true }
        '204':
          description: Non-push event acknowledged and dropped
        '400':
          description: Malformed JSON payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Missing/invalid X-Hub-Signature-256
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Unknown app or no Git source bound
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Rate limited (120/min/IP)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Admin session cookie set by `POST /api/auth/login`.
  parameters:
    AppId:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: Application ID
  schemas:
    App:
      type: object
      properties:
        id: { type: integer, example: 7 }
        name: { type: string, example: "my-app" }
        path: { type: string, example: "/data/microverse/apps/my-app" }
        deploy_type:
          type: string
          enum: [npm, http-server, nginx]
          example: "npm"
        port: { type: integer, nullable: true, example: 3000 }
        status:
          type: string
          enum: [running, stopped]
          example: "running"
        metrics:
          type: object
          nullable: true
          description: Latest resource sample (null if the app has never run / sampler has no data).
          properties:
            ts: { type: integer, description: "epoch ms" }
            cpu: { type: number, description: "CPU %" }
            memory: { type: integer, description: "bytes" }
            uptimeMs: { type: integer, description: "uptime in ms" }
        git:
          $ref: '#/components/schemas/GitSummary'
        created_at: { type: string, example: "2026-07-12 03:25:59" }
        updated_at: { type: string, example: "2026-07-12 03:26:23" }
    AppCreateInput:
      type: object
      required: [name, deploy_type]
      properties:
        name: { type: string, example: "my-app" }
        deploy_type:
          type: string
          enum: [npm, http-server, nginx]
          example: "npm"
        git_url:
          type: string
          description: Optional Git repository URL; when present the source is bound in the same call.
          example: "https://github.com/owner/repo"
        git_branch:
          type: string
          default: main
          description: Branch to deploy (only meaningful with git_url).
        git_auto_update:
          type: boolean
          default: true
          description: Pull on start and on webhook pushes (only meaningful with git_url).
    GitSummary:
      type: object
      nullable: true
      description: Secret-free Git binding attached to app responses (null when the app is not Git-sourced).
      properties:
        url: { type: string, example: "https://github.com/owner/repo" }
        branch: { type: string, example: "main" }
        auto_update: { type: integer, enum: [0, 1], example: 1 }
        deployed_commit: { type: string, nullable: true, example: "3f2a9c1..." }
        remote_commit: { type: string, nullable: true, example: "9b1e0d4..." }
        synced_at: { type: string, nullable: true, example: "2026-07-12 03:26:23" }
        last_status:
          type: string
          enum: [idle, updating, success, failed, update_available]
          example: "success"
        last_error: { type: string, nullable: true }
    AppGitSource:
      type: object
      description: Admin-facing Git binding. Unlike `GitSummary`, includes the webhook URL and secret.
      properties:
        url: { type: string, example: "https://github.com/owner/repo" }
        branch: { type: string, example: "main" }
        autoUpdate: { type: boolean, example: true }
        webhookUrl: { type: string, example: "https://apps.example.com/api/webhooks/github/7" }
        webhookSecret: { type: string, example: "0123456789abcdef..." }
        deployedCommit: { type: string, nullable: true }
        remoteCommit: { type: string, nullable: true }
        syncedAt: { type: string, nullable: true }
        lastStatus:
          type: string
          enum: [idle, updating, success, failed, update_available]
          example: "success"
        lastError: { type: string, nullable: true }
    GitBindInput:
      type: object
      required: [url]
      properties:
        url: { type: string, example: "https://github.com/owner/repo" }
        branch: { type: string, example: "main", description: Defaults to main on first bind; omitted keeps the current branch." }
        autoUpdate: { type: boolean, description: "Omitted keeps the current value; defaults to true on first bind." }
    GitCheckResult:
      type: object
      properties:
        remoteCommit: { type: string, nullable: true, description: null when the branch does not exist on the remote }
        deployedCommit: { type: string, nullable: true }
        upToDate: { type: boolean, example: false }
    GitPullResult:
      type: object
      properties:
        status:
          type: string
          enum: [success, up-to-date]
          example: "success"
        deployedCommit: { type: string, nullable: true }
    EnvEntry:
      type: object
      required: [key]
      properties:
        key: { type: string, example: "API_KEY" }
        value: { type: string, nullable: true, example: "secret123" }
    EnvPutInput:
      type: object
      required: [env]
      properties:
        env:
          type: array
          items: { $ref: '#/components/schemas/EnvEntry' }
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          required: [message]
          properties:
            message: { type: string, example: "App not found" }
    UploadResponse:
      type: object
      properties:
        filesUploaded: { type: integer, example: 2 }
        files:
          type: array
          items: { type: string }
          example: ["index.html", "server.js"]
    FileEntry:
      type: object
      properties:
        name: { type: string, example: "index.html" }
        type:
          type: string
          enum: [file, directory]
          example: "file"
        path: { type: string, example: "index.html", description: "Relative to the app root (absolute server paths are never exposed)" }
    HealthData:
      type: object
      properties:
        status: { type: string, example: "ok" }
        timestamp: { type: string, format: date-time }
        uptime: { type: number, example: 21.302 }
    ConfigData:
      type: object
      properties:
        upload:
          type: object
          properties:
            maxFileSize: { type: integer, example: 104857600 }
            maxFiles: { type: integer, example: 100 }
